<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX </title>
  
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        $(document).ready(function ()
        {
          
            $("#b1").click(function () {
                
                $.get("data.txt", function (data, status) {
                  
                    if (status == "success") {
                        
                        $("div").text(data);
                        
                    } else
                    {
                        
                    $("div").text("Error loading data");
                    }
                });
            });
        });
    </script>
</head>
<body>
    
<button id="b1">Load Data</button>

<div></div>

</body>
</html>
