<!DOCTYPE html>
<html>
<head>
  <title>User Data Input with Username</title>
</head>
<body>

  <h2>User Information Form</h2>
  <label for="firstName">First Name:</label>
  <input type="text" id="firstName" /><br/><br/>
  
  <label for="lastName">Last Name:</label>
  <input type="text" id="lastName" /><br/><br/>
  
  <label for="age">Age:</label>
  <input type="number" id="age" /><br/><br/>
  
  <button onclick="processData()">Submit</button>
  <br>
  <br>

  <table border="1" id="userTable">
    <thead>
      <tr>
        <th>First Name</th><th>Last Name</th><th>Age</th><th>Username</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script>
    function processData(){
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const age = document.getElementById("age").value;


      const username = 
        firstName.substring(0,2).toLowerCase() + 
        lastName.substring(lastName.length-2).toLowerCase() + 
        age;

      const userObj = {
        firstName: firstName,
        lastName: lastName,
        age: age,
        username: username
      };

      const jsonData = JSON.stringify(userObj);
      const userData = JSON.parse(jsonData);

     
      const tableBody = document.getElementById('userTable').getElementsByTagName('tbody')[0];
      const newRow = tableBody.insertRow();

      newRow.insertCell(0).textContent = userData.firstName;
      newRow.insertCell(1).textContent = userData.lastName;
      newRow.insertCell(2).textContent = userData.age;
      newRow.insertCell(3).textContent = userData.username;

    }
  </script>
</body>
</html>
